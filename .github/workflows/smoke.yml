name: CGU smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar DOM de testes (somente neste runner)
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Testar carregamento, rotas, editais, histórico, intensivão, P4 e persistência
        run: node --test tests/smoke.test.mjs tests/ui.test.mjs
